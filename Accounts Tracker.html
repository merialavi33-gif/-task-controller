<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standalone Accounts Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        .unified-glass-panel {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }
        .account-item-card {
            background: rgba(15, 23, 42, 0.65) !important;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .filter-container-bg {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(245, 158, 11, 0.12) 100%);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }
        .filter-tab {
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
            border: 1px solid #334155;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 9999px;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
        }
        .filter-tab.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35);
        }
        .btn-day-adjust {
            font-weight: 700;
            font-size: 0.72rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }
        .btn-day-edit {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            color: #ffffff;
            border: 1px solid #fbbf24;
        }
        .btn-day-save {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            border: 1px solid #34d399;
        }
        .btn-day-reset {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: #ffffff;
            border: 1px solid #f87171;
        }
        .point-input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f59e0b;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            width: 90px;
            text-align: center;
        }
        @keyframes pulse-urgent {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.85; }
        }
        .urgent-pulse { animation: pulse-urgent 1.2s infinite; }
    </style>
</head>
<body class="p-4 flex items-center justify-center">

    <!-- Accounts Tracker Container -->
    <div class="unified-glass-panel w-full max-w-lg rounded-3xl p-5 shadow-2xl flex flex-col max-h-[90vh]">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800 mb-3 flex-shrink-0">
            <div class="flex items-center gap-2.5 min-w-0 pr-2">
                <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 flex-shrink-0">
                    <i class="fa-solid fa-chart-line text-sm"></i>
                </div>
                <div class="min-w-0">
                    <h3 class="text-sm font-bold text-slate-100 truncate">Accounts Tracker</h3>
                    <p class="text-[10px] text-slate-400 truncate">ቀናት እና ነጥቦች መከታተያ</p>
                </div>
            </div>
        </div>

        <div class="filter-container-bg p-2 rounded-2xl mb-3 flex-shrink-0">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="poppo">Poppo</button>
                <button class="filter-tab" data-filter="desdes">desdes</button>
                <button class="filter-tab" data-filter="tello">tello</button>
                <button class="filter-tab" data-filter="kaya">Kaya</button>
                <button class="filter-tab" data-filter="yago">Yago</button>
            </div>
        </div>

        <div id="accounts-list-container" class="space-y-3 overflow-y-auto pr-1 flex-1">
            <!-- Dynamically populated accounts -->
        </div>
        
        <div class="pt-3 border-t border-slate-800 mt-3 text-center flex-shrink-0">
            <p class="text-[10px] text-slate-500">🚀 Accounts are sorted by remaining days.</p>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const appRules = {
            poppo: { daily: 2800, target: 100000, targetFormatted: "100k", name: "Poppo", badgeColor: "bg-rose-500/20 text-rose-400 border-rose-500/30" },
            desdes: { daily: 10000, target: 1000000, targetFormatted: "1m", name: "desdes", badgeColor: "bg-blue-500/20 text-blue-400 border-blue-500/30" },
            tello: { daily: 10000, target: 1000000, targetFormatted: "1m", name: "tello", badgeColor: "bg-teal-500/20 text-teal-400 border-teal-500/30" },
            kaya:  { daily: 1000, target: 100000, targetFormatted: "100k", name: "Kaya", badgeColor: "bg-purple-500/20 text-purple-400 border-purple-500/30" },
            yago:  { daily: 1200, target: 100000, targetFormatted: "100k", name: "Yago", badgeColor: "bg-amber-500/20 text-amber-400 border-amber-500/30" }
        };

        const devicesData = [
            {
                id: "pro", name: "Phone Pro", color: "from-blue-500 to-cyan-500",
                poppo: [{ id: "pro_poppo_1", name: "Poppo (pro)", type: "poppo" }],
                desdes: [],
                tello: [{ id: "pro_tello_1", name: "tello live (kalkidan)", type: "tello" }],
                kaya: [], yago: []
            },
            {
                id: "nova", name: "Phone Nova", color: "from-purple-500 to-pink-500",
                poppo: [{ id: "nova_poppo_1", name: "Poppo (nova)", type: "poppo" }],
                desdes: [{ id: "nova_tello_1", name: "desdes live (neli) - Party (2 hrs)", type: "desdes" }],
                tello: [{ id: "nova_tello_2", name: "tello live (bruksol12)", type: "tello" }],
                kaya: [{ id: "nova_kaya_1", name: "Kaya (abigia) - Party (2 hrs)", type: "kaya" }],
                yago: []
            },
            {
                id: "eh", name: "Phone EH", color: "from-orange-500 to-red-500",
                poppo: [{ id: "eh_poppo_1", name: "Poppo (lavish esha)", type: "poppo" }],
                desdes: [],
                tello: [{ id: "eh_tello_1", name: "tello live (eftah)", type: "tello" }],
                kaya: [{ id: "eh_kaya_1", name: "Kaya (kayakal) - Party (2 hrs)", type: "kaya" }],
                yago: []
            },
            {
                id: "yab", name: "Phone Yab", color: "from-emerald-500 to-teal-500",
                poppo: [{ id: "yab_poppo_1", name: "Poppo (yab)", type: "poppo" }],
                desdes: [{ id: "yab_tello_1", name: "desdes live (afi man) - Party (2 hrs)", type: "desdes" }],
                tello: [{ id: "yab_tello_2", name: "tello live (emanda)", type: "tello" }],
                kaya: [],
                yago: [{ id: "yab_yago_1", name: "Yago (agb man) - Party (1 hr)", type: "yago" }]
            },
            {
                id: "zte", name: "Phone ZTE", color: "from-indigo-500 to-violet-500",
                poppo: [{ id: "zte_poppo_1", name: "Poppo (hiri mon)", type: "poppo" }],
                desdes: [],
                tello: [{ id: "zte_tello_1", name: "tello live (tsi1229)", type: "tello" }],
                kaya: [{ id: "zte_kaya_1", name: "Kaya (gigi.m) - Party (2 hrs)", type: "kaya" }],
                yago: []
            },
            {
                id: "readspark", name: "Phone 📕 spark", color: "from-rose-500 to-pink-500",
                poppo: [{ id: "readspark_poppo_1", name: "Poppo (neli jack)", type: "poppo" }],
                desdes: [],
                tello: [{ id: "readspark_tello_1", name: "tello live (mariya lavi)", type: "tello" }],
                kaya: [{ id: "readspark_kaya_1", name: "Kaya (mama) - Party (2 hrs)", type: "kaya" }],
                yago: []
            }
        ];

        let editingStates = {};
        let currentFilter = 'all';

        function formatPoints(points) {
            if (isNaN(points)) return "0";
            return Number(points).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function getAccountStats(accId, appType) {
            let earnedPoints = parseFloat(localStorage.getItem(accId + '_earned_points') || '0');
            if (isNaN(earnedPoints)) earnedPoints = 0;
            
            const rule = appRules[appType];
            let daysWorked = Math.floor(earnedPoints / rule.daily);

            const remainingPoints = Math.max(0, rule.target - earnedPoints);
            const remainingDays = Math.max(0, Math.ceil(remainingPoints / rule.daily));

            return { 
                accId,
                appType,
                daysWorked, 
                earnedPoints, 
                earnedFormatted: formatPoints(earnedPoints),
                remainingDays, 
                target: rule.target,
                targetFormatted: rule.targetFormatted 
            };
        }

        function updatePoppoAccountsModalList() {
            const container = document.getElementById('accounts-list-container');
            if (!container) return;

            let allAccounts = [];
            devicesData.forEach(dev => {
                ['poppo', 'desdes', 'tello', 'kaya', 'yago'].forEach(appKey => {
                    dev[appKey].forEach(item => {
                        allAccounts.push({ name: item.name, devName: dev.name, color: dev.color, ...getAccountStats(item.id, appKey) });
                    });
                });
            });

            let filtered = allAccounts.filter(acc => {
                if (currentFilter === 'all') return true;
                return acc.appType === currentFilter;
            });

            filtered.sort((a, b) => a.remainingDays - b.remainingDays);

            let html = '';
            filtered.forEach(acc => {
                const isUrgent = acc.remainingDays <= 10;
                const ruleConfig = appRules[acc.appType];
                const isEditing = editingStates[acc.accId] || false;

                let pointsDisplayHtml = isEditing 
                    ? `<input type="number" id="${acc.accId}_input" value="${acc.earnedPoints}" class="point-input" step="any" min="0">` 
                    : `<strong class="text-amber-400 font-extrabold">${acc.earnedFormatted}</strong>`;

                let actionButtonHtml = isEditing 
                    ? `<button onclick="saveAccountPoints('${acc.accId}', '${acc.appType}')" class="btn-day-adjust btn-day-save"><i class="fa-solid fa-floppy-disk text-[10px]"></i> Save</button>` 
                    : `<button onclick="toggleEditPoints('${acc.accId}')" class="btn-day-adjust btn-day-edit"><i class="fa-solid fa-pen-to-square text-[10px]"></i> Edit</button>`;

                html += `
                <div class="account-item-card border ${isUrgent ? 'border-emerald-500/80 shadow-lg shadow-emerald-500/10' : 'border-slate-700/50'} rounded-2xl p-3 space-y-2">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${acc.color} flex items-center justify-center text-white flex-shrink-0 shadow">
                                <i class="fa-solid fa-video text-xs"></i>
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <h4 class="text-xs font-bold text-slate-100 truncate">${acc.name}</h4>
                                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded border uppercase ${ruleConfig.badgeColor}">${acc.appType}</span>
                                </div>
                                <p class="text-[10px] text-slate-400 mt-0.5">Device: <span class="text-slate-300 font-semibold">${acc.devName}</span></p>
                            </div>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <div class="${isUrgent ? 'text-emerald-400 font-extrabold text-xs urgent-pulse bg-emerald-500/10 px-2.5 py-1 rounded-xl border border-emerald-500/40' : 'text-amber-400 font-bold text-xs'}">
                                ${acc.remainingDays} DAYS LEFT!
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-[11px] pt-1 border-t border-slate-700/40">
                        <span>Days Done: <strong class="text-amber-400">${acc.daysWorked}d</strong></span>
                        <span>Points: ${pointsDisplayHtml} / <span class="text-slate-300 font-bold">${acc.targetFormatted}</span></span>
                        <div class="flex items-center gap-1">
                            ${actionButtonHtml}
                            <button onclick="resetAccountDays('${acc.accId}')" class="btn-day-adjust btn-day-reset"><i class="fa-solid fa-rotate-left text-[9px]"></i></button>
                        </div>
                    </div>
                </div>`;
            });

            if (filtered.length === 0) {
                html = '<p class="text-center text-xs text-slate-500 py-6">No accounts found for this filter.</p>';
            }

            container.innerHTML = html;
        }

        window.toggleEditPoints = function(accId) {
            editingStates[accId] = true;
            updatePoppoAccountsModalList();
        }

        window.saveAccountPoints = function(accId, appType) {
            const inputElem = document.getElementById(accId + '_input');
            if (inputElem) {
                let newPoints = parseFloat(inputElem.value);
                if (isNaN(newPoints) || newPoints < 0) {
                    alert('Please enter a valid points value!');
                    return;
                }
                localStorage.setItem(accId + '_earned_points', newPoints);
                editingStates[accId] = false;
                updatePoppoAccountsModalList();
            }
        }

        window.resetAccountDays = function(accId) {
            if (confirm('Do you want to reset this account points and days to 0?')) {
                editingStates[accId] = false;
                localStorage.setItem(accId + '_earned_points', 0);
                updatePoppoAccountsModalList();
            }
        }

        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                updatePoppoAccountsModalList();
            });
        });

        // Initial Load
        updatePoppoAccountsModalList();
    </script>
</body>
</html>
